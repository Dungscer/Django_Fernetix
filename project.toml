[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django_fernet"
version = "0.1.0"
description = "Custom django fields  for storing encrypted values"
authors = [
    { name="Dungscer", email="dungscer@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "Django>=4.0",
    "cryptography>=41.0"
]

[tool.setuptools.packages.find]
where = ["src"]